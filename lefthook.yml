# Jobs run in order. Format runs before lint because format can change the files that lint reads.

glob_matcher: doublestar
# scripts/lefthook runs lefthook from the repository root. Git sets GIT_DIR in a
# linked worktree, so `go -C backend tool lefthook` would use backend/ as the root.
lefthook: scripts/lefthook

pre-commit:
  jobs:
    - name: frontend-format
      root: frontend/
      run: pnpm exec oxfmt --no-error-on-unmatched-pattern --write {staged_files}
      stage_fixed: true

    - name: frontend-oxlint
      root: frontend/
      glob: "**/*.{js,mjs,cjs,ts,tsx,mts,cts}"
      run: pnpm exec oxlint --fix --deny-warnings --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true

    - name: frontend-eslint
      root: frontend/
      glob: "**/*.{js,mjs,cjs,ts,tsx,mts,cts}"
      run: pnpm exec eslint --fix --max-warnings 0 --no-warn-ignored {staged_files}
      stage_fixed: true

    - name: frontend-types
      root: frontend/
      glob: "**/*.{ts,tsx,mts,cts}"
      run: pnpm run lint:types

    - name: backend-format
      root: backend/
      glob: "**/*.go"
      run: go tool golangci-lint fmt --config .golangci.yml {staged_files}
      stage_fixed: true

    - name: backend-lint
      root: backend/
      run: go tool golangci-lint run --config .golangci.yml

    - name: backend-analyzers
      root: backend/
      run: go run ./lint/cmd/analyzers . ./internal/...

# script: always runs. A run: job skips when the push has no file changes.
# use_stdin passes the Git ref list. Without it lefthook keeps stdin open.
pre-push:
  jobs:
    - name: reject-merge-commits
      script: reject-merge-commits
      runner: sh
      use_stdin: true

# Remove the trailer that Cursor adds to commit messages.
commit-msg:
  jobs:
    - name: remove-cursor-trailer
      run: |
        message='{1}'
        tmp="$message.tmp"
        trap 'rm -f "$tmp"' 0
        grep -v -x -F 'Co-authored-by: Cursor <cursoragent@cursor.com>' "$message" >"$tmp" || { status=$?; [ "$status" -eq 1 ] || exit "$status"; }
        mv "$tmp" "$message"
