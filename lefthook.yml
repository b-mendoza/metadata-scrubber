# Jobs run in order. Format runs before lint because format can change the files that lint reads.

glob_matcher: doublestar
lefthook: '"$(go -C backend tool -n lefthook)"'

pre-commit:
  jobs:
    - name: frontend-format
      root: frontend/
      run: pnpm exec oxfmt --no-error-on-unmatched-pattern --write {staged_files}
      stage_fixed: true

    - name: frontend-oxlint
      root: frontend/
      glob: "**/*.{js,mjs,cjs,ts,tsx,mts,cts}"
      run: pnpm exec oxlint --fix --deny-warnings {staged_files}
      stage_fixed: true

    - name: frontend-eslint
      root: frontend/
      glob: "**/*.{js,mjs,cjs,ts,tsx,mts,cts}"
      run: pnpm exec eslint --fix --max-warnings 0 --no-warn-ignored {staged_files}
      stage_fixed: true

    - name: frontend-types
      root: frontend/
      glob: "**/*.{ts,tsx,mts,cts}"
      run: pnpm run lint:types

    - name: backend-format
      root: backend/
      glob: "**/*.go"
      run: go tool golangci-lint fmt --config .golangci.yml {staged_files}
      stage_fixed: true

    - name: backend-lint
      root: backend/
      run: go tool golangci-lint run --config .golangci.yml

    - name: backend-analyzers
      root: backend/
      run: go run ./lint/cmd/analyzers . ./internal/...

# Remove the trailer that Cursor adds to commit messages.
commit-msg:
  jobs:
    - name: remove-cursor-trailer
      run: |
        message='{1}'
        tmp="$message.tmp"
        trap 'rm -f "$tmp"' 0
        grep -v -x -F 'Co-authored-by: Cursor <cursoragent@cursor.com>' "$message" >"$tmp" || { status=$?; [ "$status" -eq 1 ] || exit "$status"; }
        mv "$tmp" "$message"
