# Sequential jobs keep format ahead of lint. Format can change the files that lint reads.
# lefthook skips a job when no staged file matches that job's root or glob.

min_version: 2.2.2
assert_lefthook_installed: true
glob_matcher: doublestar
# Git hooks run lefthook through the backend Go module.
lefthook: go -C backend tool lefthook

pre-commit:
  parallel: false
  jobs:
    - name: frontend-format
      root: frontend/
      exclude:
        - "**/.claude/skills/**"
        - "**/.agents/skills/**"
      run: pnpm exec oxfmt --no-error-on-unmatched-pattern --write {staged_files}
      stage_fixed: true

    - name: frontend-oxlint
      root: frontend/
      glob: "**/*.{js,mjs,cjs,ts,tsx,mts,cts}"
      run: pnpm exec oxlint --fix --deny-warnings {staged_files}
      stage_fixed: true

    - name: frontend-eslint
      root: frontend/
      glob: "**/*.{js,mjs,cjs,ts,tsx,mts,cts}"
      run: pnpm exec eslint --fix --max-warnings 0 --no-warn-ignored {staged_files}
      stage_fixed: true

    - name: frontend-types
      root: frontend/
      glob: "**/*.{ts,tsx,mts,cts}"
      run: pnpm run lint:types

    - name: backend-format
      root: backend/
      glob: "**/*.go"
      run: go tool golangci-lint fmt --config .golangci.yml {staged_files}
      stage_fixed: true

    - name: backend-lint
      root: backend/
      run: go tool golangci-lint run --config .golangci.yml

    - name: backend-analyzers
      root: backend/
      run: go run ./lint/cmd/analyzers . ./internal/...
