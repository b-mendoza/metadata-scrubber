name: Frontend Quality Checks

on:
  pull_request:
    paths:
      - .github/workflows/frontend-checks.yaml
      - frontend/**

  push:
    branches:
      - main
    paths:
      - .github/workflows/frontend-checks.yaml
      - frontend/**

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: frontend

jobs:
  quality-checks:
    name: Run code quality checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
          package_json_file: ./frontend/package.json

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ./frontend/.nvmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # lint:* already runs in parallel through run-p. Separate steps keep the
      # same one-job wall clock and record each script's duration. Extra jobs
      # would repeat the ~25s setup for checks that already finish in ~27s.
      - name: Run ESLint
        run: pnpm run lint:eslint
        background: true

      - name: Run Oxlint
        run: pnpm run lint:oxlint
        background: true

      - name: Check formatting
        run: pnpm run lint:oxfmt
        background: true

      - name: Check types
        run: pnpm run lint:types
        background: true

      - name: Run knip
        run: pnpm run lint:knip
        background: true

      - name: Run React Doctor
        run: pnpm run lint:doctor
        background: true

      - name: Run tests
        run: pnpm run test
        background: true

      - wait-all:
