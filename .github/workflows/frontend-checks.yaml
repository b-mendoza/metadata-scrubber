name: Frontend Quality Checks

on:
  pull_request:
    paths:
      - .github/actions/frontend/**
      - .github/workflows/frontend-checks.yaml
      - frontend/**

  push:
    branches:
      - main
    paths:
      - .github/actions/frontend/**
      - .github/workflows/frontend-checks.yaml
      - frontend/**

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-checks:
    name: Run code quality checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Setup Node.js, pnpm and dependencies"
        uses: $/.github/actions/frontend/setup-env

      # lint:* already runs in parallel through run-p. Separate steps keep the
      # same one-job wall clock and record each script's duration. Extra jobs
      # would repeat the ~25s setup for checks that already finish in ~27s.
      - name: Run ESLint
        working-directory: ./frontend
        run: pnpm run lint:eslint
        background: true

      - name: Run Oxlint
        working-directory: ./frontend
        run: pnpm run lint:oxlint
        background: true

      - name: Check formatting
        working-directory: ./frontend
        run: pnpm run lint:oxfmt
        background: true

      - name: Check types
        working-directory: ./frontend
        run: pnpm run lint:types
        background: true

      - name: Run knip
        working-directory: ./frontend
        run: pnpm run lint:knip
        background: true

      - name: Run React Doctor
        working-directory: ./frontend
        run: pnpm run lint:doctor
        background: true

      - name: Run tests
        working-directory: ./frontend
        run: pnpm run test
        background: true

      - wait-all:
