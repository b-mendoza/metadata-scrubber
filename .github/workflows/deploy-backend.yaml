name: Deploy Backend to Production

on:
  workflow_dispatch: null

concurrency:
  group: "${{ github.workflow }}"

jobs:
  quality-checks:
    name: Run code quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Setup Go and Task"
        uses: ./.github/actions/backend/setup-env

      - name: "Run linting, formatting and tests"
        uses: ./.github/actions/backend/quality-checks

  deploy:
    name: Deploy backend Worker and container
    needs:
      - quality-checks
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
          package_json_file: ./backend/package.json

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ./backend/package.json

      - name: Install dependencies
        working-directory: ./backend
        run: pnpm install --frozen-lockfile

      - name: Verify generated backend Cloudflare types
        working-directory: ./backend
        run: |
          pnpm run codegen:cloudflare
          git diff --exit-code -- worker-configuration.d.ts

      - name: Check backend Worker types
        working-directory: ./backend
        run: pnpm run lint:types

      - name: Deploy backend Worker and container
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: "${{ secrets.CLOUDFLARE_API_TOKEN }}"
          accountId: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
          packageManager: pnpm
          workingDirectory: backend
