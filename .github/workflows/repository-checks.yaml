name: Repository Checks

on:
  pull_request:

  push:
    branches:
      - main

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Scan secrets and lint workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: secretlint
        uses: docker://secretlint/secretlint:v13.0.7@sha256:4e0d997d1c395992de2cce32442fd5ff8ad4f3460a765b681c02c38226476cb4
        with:
          args: secretlint --maskSecrets --no-gitignore **/*

      - name: zizmor
        uses: docker://ghcr.io/zizmorcore/zizmor:1.30.1@sha256:a2eb396d886c053073405c7a980f2139ba2248ec172243cfa3841e57196e8101
        with:
          args: --offline --persona=auditor .github/

      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
