name: Deploy Frontend to Production

on:
  workflow_dispatch: null

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}"

jobs:
  quality-checks:
    name: Run code quality checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Setup Node.js, pnpm and dependencies"
        uses: ./.github/actions/frontend/setup-env

      - name: "Run linting, formatting and type checks"
        uses: ./.github/actions/frontend/quality-checks

  deploy:
    name: Deploy frontend Worker
    needs:
      - quality-checks
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Setup Node.js, pnpm and dependencies"
        uses: ./.github/actions/frontend/setup-env

      - name: Build frontend
        working-directory: ./frontend
        run: pnpm run build

      - name: Deploy frontend Worker
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: "${{ secrets.CLOUDFLARE_API_TOKEN }}"
          accountId: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
          packageManager: pnpm
          workingDirectory: frontend
