name: Backend Quality Checks

on:
  pull_request:
    paths:
      - .github/actions/backend/**
      - .github/workflows/backend-checks.yaml
      - backend/**

  push:
    branches:
      - main
    paths:
      - .github/actions/backend/**
      - .github/workflows/backend-checks.yaml
      - backend/**

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  quality-checks:
    name: Lint, vet and test the backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
          package_json_file: ./backend/package.json

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ./backend/package.json

      - name: Install backend Worker dependencies
        working-directory: ./backend
        run: pnpm install --frozen-lockfile

      - name: Check backend Worker types
        working-directory: ./backend
        run: pnpm run lint:types

      - name: "Setup Go and Task"
        uses: ./.github/actions/backend/setup-env

      - name: "Run linting, formatting and tests"
        uses: ./.github/actions/backend/quality-checks

      - name: Verify modules
        working-directory: ./backend
        run: go mod verify

      - name: Check module files are tidy
        working-directory: ./backend
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  security:
    name: Run backend security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Setup Go and Task"
        uses: ./.github/actions/backend/setup-env

      - name: Run vulnerability scan
        working-directory: ./backend
        run: task security
