name: Backend Quality Checks

on:
  pull_request:
    paths:
      - .github/actions/backend/**
      - .github/workflows/backend-checks.yaml
      - backend/**

  push:
    branches:
      - main
    paths:
      - .github/actions/backend/**
      - .github/workflows/backend-checks.yaml
      - backend/**

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint the backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Setup Go and Task"
        uses: $/.github/actions/backend/setup-env

      - name: Run golangci-lint
        working-directory: ./backend
        run: go tool task lint:golangci
        background: true

      - name: Run custom analyzers
        working-directory: ./backend
        run: go tool task lint:analyzers
        background: true

      - wait-all:

  test:
    name: Test the backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Setup Go and Task"
        uses: $/.github/actions/backend/setup-env

      - name: Test
        working-directory: ./backend
        run: go tool task test
        background: true

      - name: Verify modules
        working-directory: ./backend
        run: go mod verify
        background: true

      - name: Check module files are tidy
        working-directory: ./backend
        run: go mod tidy -diff
        background: true

      - wait-all:

  quality-checks:
    name: Lint, vet and test the backend
    runs-on: ubuntu-latest
    needs:
      - lint
      - test
    if: ${{ !cancelled() }}
    steps:
      - name: Require lint and test to pass
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          test "$LINT_RESULT" = "success"
          test "$TEST_RESULT" = "success"

  security:
    name: Run backend security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Setup Go and Task"
        uses: $/.github/actions/backend/setup-env

      - name: Run vulnerability scan
        working-directory: ./backend
        run: go tool task security
