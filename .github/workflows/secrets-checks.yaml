name: Secrets Checks

on:
  pull_request:

  push:
    branches:
      - main

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secret-scan:
    name: Scan the repository for secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check secrets
        uses: docker://secretlint/secretlint:v13.1.0@sha256:09cecd95d96321cff87bcef3b200873d74d642daf507ace5ea58c0ad03ba0f0b
        with:
          args: secretlint --maskSecrets --no-gitignore **/*
