name: Repository Checks

on:
  pull_request:

  push:
    branches:
      - main

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secret-scan:
    name: Scan the repository for secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check secrets
        uses: docker://secretlint/secretlint:v13.1.0@sha256:09cecd95d96321cff87bcef3b200873d74d642daf507ace5ea58c0ad03ba0f0b
        with:
          args: secretlint --maskSecrets --no-gitignore **/*

  workflow-lint:
    name: Lint the GitHub Actions workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check workflows with zizmor
        uses: docker://ghcr.io/zizmorcore/zizmor:1.31.1@sha256:42d409dbb851d4c5d35a058cf042b828bea1e3f2884378c526eb0974780e18d9
        with:
          args: --offline --persona=auditor .github/
        background: true

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Install actionlint from a module path. Do not cache this repo's go.sum.
          go-version-file: ./backend/go.mod
          cache: false

      - name: Install actionlint
        # Astral publishes no fork release or image yet. Pin a reviewed commit.
        # The fork accepts $/ refs and background/wait-all steps.
        # Upstream still rejects those forms. See rhysd/actionlint#711 and #693.
        # https://github.com/astral-sh/actionlint/commit/dbad7bbbc92988579c4050c3389de41e9762123a
        run: go install github.com/astral-sh/actionlint/cmd/actionlint@dbad7bbbc92988579c4050c3389de41e9762123a

      - name: Check workflows with actionlint
        # ubuntu-latest includes shellcheck. actionlint uses it when it is on PATH.
        run: actionlint
        background: true

      - wait-all:
