name: "Setup Go"

description: "Sets up the Go toolchain, restores the Go build/module cache, and downloads dependencies"

runs:
  using: composite
  steps:
    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: ./backend/go.mod
        # setup-go's built-in cache uses one key per go.sum. Parallel jobs then
        # race to save that key. The faster security job wins and stores a cache
        # that does not include the golangci-lint compile. Later lint jobs
        # restore that incomplete cache and cannot replace it.
        cache: false

    - name: Resolve Go cache paths
      id: go-cache-paths
      shell: bash
      run: |
        echo "modcache=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
        echo "buildcache=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"

    - name: Cache Go modules, build output, and golangci-lint
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ steps.go-cache-paths.outputs.modcache }}
          ${{ steps.go-cache-paths.outputs.buildcache }}
          ~/.cache/golangci-lint
        # github.job keeps lint, test, and security from writing the same key.
        # restore-keys let a cold job reuse another job's modules for the same
        # go.mod and go.sum. The post step saves this job's compile output.
        key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('backend/go.mod', 'backend/go.sum') }}-${{ github.job }}
        restore-keys: |
          go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('backend/go.mod', 'backend/go.sum') }}-
          go-${{ runner.os }}-${{ runner.arch }}-

    - name: Download dependencies
      shell: bash
      working-directory: ./backend
      run: go mod download
