name: "Setup Node.js, pnpm and dependencies"

description: Setup Node.js environment, pnpm package manager, restore and save the pnpm store and lint caches, and install project dependencies

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        run_install: false
        package_json_file: ./frontend/package.json

    - name: Set pnpm store path
      id: pnpm-store-path
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: ./frontend/.nvmrc

    # Separate restore and save steps save the store right after install.
    # The combined cache action saves only when the whole job succeeds.
    - name: Restore pnpm store cache
      id: pnpm-store-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pnpm-store-path.outputs.path }}
        key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
        restore-keys: |
          pnpm-store-${{ runner.os }}-${{ runner.arch }}-

    - name: Install dependencies
      shell: bash
      working-directory: ./frontend
      run: pnpm install --frozen-lockfile

    - name: Save pnpm store cache
      if: steps.pnpm-store-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pnpm-store-path.outputs.path }}
        key: ${{ steps.pnpm-store-cache.outputs.cache-primary-key }}

    # Restore after install so pnpm does not wipe node_modules/.cache.
    # The combined cache action saves at job end after lint writes results.
    # A cache entry cannot change, so the run ID gives each run a new key.
    # The restore keys pick the newest entry, first for the same lockfile.
    - name: Cache ESLint and type-check results
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: frontend/node_modules/.cache
        key: frontend-lint-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}-${{ github.run_id }}
        restore-keys: |
          frontend-lint-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}-
          frontend-lint-${{ runner.os }}-${{ runner.arch }}-
