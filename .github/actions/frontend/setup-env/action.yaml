name: "Setup Node.js, pnpm and dependencies"

description: Setup Node.js environment, pnpm package manager, restore/save the pnpm store and lint caches, and install project dependencies

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        run_install: false
        package_json_file: ./frontend/package.json

    - name: Set pnpm store path
      id: pnpm-store-path
      shell: bash
      run: |
        store_path="$(pnpm store path --silent)"
        mkdir -p "$store_path"
        echo "path=$store_path" >> "$GITHUB_OUTPUT"

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: ./frontend/.nvmrc

    - name: Restore pnpm store cache
      id: cache-restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pnpm-store-path.outputs.path }}
        key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
        restore-keys: |
          pnpm-store-${{ runner.os }}-${{ runner.arch }}-

    - name: Show tool versions
      shell: bash
      run: |
        node -v
        pnpm --version

    - name: Install dependencies
      shell: bash
      working-directory: ./frontend
      run: pnpm install --frozen-lockfile

    - name: Save pnpm store cache
      if: steps.cache-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pnpm-store-path.outputs.path }}
        key: ${{ steps.cache-restore.outputs.cache-primary-key }}

    # Restore after install so pnpm does not wipe node_modules/.cache.
    # The combined cache action saves at job end after lint writes results.
    - name: Cache ESLint and type-check results
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: frontend/node_modules/.cache
        key: frontend-lint-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}-${{ github.job }}
        restore-keys: |
          frontend-lint-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}-
          frontend-lint-${{ runner.os }}-${{ runner.arch }}-
