name: "Setup Node.js, pnpm and dependencies"

description: Setup pnpm and Node.js, install project dependencies, and restore lint caches

runs:
  using: composite
  steps:
    # pnpm/setup reads frontend/package.json for the pnpm and Node.js versions.
    # It installs both, then runs a frozen pnpm install. cache: true restores
    # the pnpm store before the runtime install.
    - name: Setup pnpm and Node.js
      uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
      with:
        working-directory: frontend
        cache: true
        require-lockfile: true

    # Restore after install so pnpm does not wipe node_modules/.cache.
    # The combined cache action saves at job end after lint writes results.
    # A cache entry cannot change, so the run ID gives each run a new key.
    # The restore keys pick the newest entry, first for the same lockfile.
    - name: Cache ESLint and type-check results
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: frontend/node_modules/.cache
        key: frontend-lint-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}-${{ github.run_id }}
        restore-keys: |
          frontend-lint-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}-
          frontend-lint-${{ runner.os }}-${{ runner.arch }}-
