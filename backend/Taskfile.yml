#:schema https://taskfile.dev/schema.json

version: "3.51.1"

vars:
  BINARY: metadata-scrubber
  GOLANGCI_LINT_CONFIG: .golangci.yml
  # Custom analyzers check application packages only. Add new application directories here.
  APPLICATION_PACKAGES: . ./internal/...

tasks:
  build:
    desc: Compile the project into a binary
    cmds:
      - go build -o {{.BINARY}} .

  run:
    desc: Run the project
    cmds:
      - go run .

  test:
    desc: Run the test suite with the race detector and coverage
    cmds:
      - go test -race -cover ./...

  test:coverage:
    desc: Run the suite writing a coverage profile, then print the per-function summary
    cmds:
      - go test -race -covermode=atomic -coverprofile=coverage.out ./...
      - go tool cover -func=coverage.out

  test:watch:
    desc: Re-run the test suite whenever Go sources, test fixtures, or module files change
    watch: true
    # Run at watcher startup even when a previous run is up to date.
    method: none
    sources:
      - "**/*.go"
      - "**/testdata/**"
      - go.mod
      - go.sum
    cmds:
      - task: test

  # golangci-lint run checks formatting as well as lint rules.
  lint:
    desc: Lint and verify formatting (read-only)
    cmds:
      - go tool golangci-lint run --config {{.GOLANGCI_LINT_CONFIG}}
      - go run ./lint/cmd/analyzers {{.APPLICATION_PACKAGES}}

  # Advisory security scan. It queries the changing Go vulnerability database.
  security:
    desc: Scan dependencies for known vulnerabilities (networked)
    cmds:
      - go tool govulncheck ./...

  # Check custom rules after auto-fixes and formatting can change the source.
  fix:
    desc: Apply lint auto-fixes and format the source code (writes files)
    cmds:
      - go tool golangci-lint run --config {{.GOLANGCI_LINT_CONFIG}} --fix
      - go tool golangci-lint fmt --config {{.GOLANGCI_LINT_CONFIG}}
      - go run ./lint/cmd/analyzers {{.APPLICATION_PACKAGES}}

  tidy:
    desc: Add missing and remove unused module dependencies
    cmds:
      - go mod tidy
