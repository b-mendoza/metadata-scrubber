#:schema https://taskfile.dev/schema.json

version: "3.51.1"

vars:
  BINARY: metadata-scrubber
  GOLANGCI_LINT_CONFIG: .golangci.yml

tasks:
  build:
    desc: Compile the project into a binary
    cmds:
      - go build -o {{.BINARY}} .

  run:
    desc: Run the project
    cmds:
      - go run .

  test:
    desc: Run the test suite with the race detector and coverage
    cmds:
      - go test -race -cover ./...

  test:coverage:
    desc: Run the suite writing a coverage profile, then print the per-function summary
    cmds:
      - go test -race -covermode=atomic -coverprofile=coverage.out ./...
      - go tool cover -func=coverage.out

  test:watch:
    desc: Re-run the test suite whenever Go sources, test fixtures, or module files change
    watch: true
    # method: none disables Task's up-to-date checkpointing so the suite
    # always runs once at watcher startup instead of being skipped as
    # "up to date" from a previous invocation's checksum.
    method: none
    sources:
      - "**/*.go"
      - "**/testdata/**"
      - go.mod
      - go.sum
    cmds:
      - task: test

  # Read-only umbrella (CI-safe, writes nothing): module hygiene + lint +
  # verify formatting. golangci-lint's `run` checks the enabled formatters
  # too, so a single command covers both — no parallel runner needed like
  # the frontend.
  lint:
    desc: Check module tidiness, lint, and verify formatting without modifying files (read-only)
    cmds:
      - task: lint:deps
      - go tool golangci-lint run --config {{.GOLANGCI_LINT_CONFIG}}

  # `go mod tidy -diff` exits non-zero when go.mod/go.sum are inconsistent
  # with the source (e.g. a dependency bump that skipped tidying — this
  # broke CI on the pdfcpu v0.14.0 update). `go mod verify` checks that
  # downloaded modules match their go.sum checksums.
  lint:deps:
    desc: Verify go.mod/go.sum are tidy and module checksums match (read-only)
    cmds:
      - go mod tidy -diff
      - go mod verify

  # Write umbrella (destructive): apply lint auto-fixes, then format. Format
  # runs last so the result is always cleanly formatted.
  fix:
    desc: Apply lint auto-fixes and format the source code (writes files)
    cmds:
      - task: fix:lint
      - task: fix:fmt

  fix:lint:
    desc: Apply lint auto-fixes where supported
    cmds:
      - go tool golangci-lint run --config {{.GOLANGCI_LINT_CONFIG}} --fix

  fix:fmt:
    desc: Format the source code with gofumpt + gci (orchestrated by golangci-lint)
    cmds:
      - go tool golangci-lint fmt --config {{.GOLANGCI_LINT_CONFIG}}

  tidy:
    desc: Add missing and remove unused module dependencies
    cmds:
      - go mod tidy
