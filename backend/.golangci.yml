version: "2"

linters:
  default: none
  enable:
    - bodyclose
    - checkedpolicylookup
    - cyclop
    # Staged rule: depguard needs a recorded package layer graph.
    # - depguard
    - errcheck
    - errorlint
    - exhaustive
    - forcetypeassert
    - funlen
    - gochecknoinits
    - gocognit
    - godox
    - gosec
    - govet
    - ineffassign
    - misspell
    - mnd
    - modernize
    - nestif
    - nilnil
    - noemptyinterface
    - nohiddentestsignal
    - nolintlint
    - noswitch
    - revive
    - staticcheck
    # Staged rule: thelper reports 22 existing helper findings.
    # - thelper
    - unconvert
    - unparam
    - unused
  settings:
    custom:
      checkedpolicylookup:
        type: module
        description: Require comma-ok lookups for marked policy maps.
      noemptyinterface:
        type: module
        description: Report empty interface types.
      nohiddentestsignal:
        type: module
        description: Report test skips and sleeps in Go test files.
      noswitch:
        type: module
        description: Report switch statements.
    cyclop:
      max-complexity: 8
      package-average: 0.0
    exhaustive:
      check:
        - map
      explicit-exhaustive-map: true
      package-scope-only: true
    funlen:
      lines: -1
      statements: 40
      ignore-comments: true
    gocognit:
      min-complexity: 9
    mnd:
      checks:
        - argument
        - case
        - condition
        - operation
        - return
        - assign
      ignored-numbers:
        - "0"
        - "1"
        - "2"
    nestif:
      min-complexity: 4
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-no-explanation: []
    revive:
      enable-all-rules: false
      rules:
        - name: argument-limit
          arguments: [4]
        - name: max-control-nesting
          arguments: [3]

formatters:
  enable:
    - gofumpt # stricter superset of gofmt; owns all non-import formatting
    - gci # deterministic, opinionated import sorting (regroups from scratch)
  settings:
    gofumpt:
      # Tell gofumpt this module's path so it groups our own packages in a
      # separate import block, matching gci's localmodule section below.
      # Without this, gofumpt and gci disagree on local-import grouping.
      module-path: metadata-scrubber
    gci:
      sections:
        - standard # standard library
        - default # third-party packages
        - localmodule # this module's own packages (auto-detected from go.mod)
