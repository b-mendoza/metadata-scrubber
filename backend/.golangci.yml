version: "2"

linters:
  default: none
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - cyclop
    # Staged rule: depguard needs a recorded package layer graph.
    # - depguard
    - durationcheck
    - errcheck
    - errname
    - errorlint
    - exhaustive
    - fatcontext
    - forbidigo
    - forcetypeassert
    - funlen
    - gocheckcompilerdirectives
    - gochecknoinits
    - gochecksumtype
    - gocognit
    - gocritic
    - godox
    - gosec
    - govet
    - inamedparam
    - ineffassign
    - interfacebloat
    - iotamixing
    - makezero
    - mirror
    - misspell
    - mnd
    - modernize
    - musttag
    - nestif
    - nilerr
    - nilnesserr
    - nilnil
    - noemptyinterface
    - nohiddentestsignal
    - nolintlint
    - nosprintfhostport
    - perfsprint
    - predeclared
    - reassign
    - recvcheck
    - revive
    # Staged rule: sloglint reports 38 existing logging-policy findings.
    # - sloglint
    - staticcheck
    - testifylint
    # Staged rule: thelper reports 22 existing helper findings.
    # - thelper
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - usetesting
    - wastedassign
  settings:
    asasalint:
      use-builtin-exclusions: false
    bidichk:
      left-to-right-embedding: true
      right-to-left-embedding: true
      pop-directional-formatting: true
      left-to-right-override: true
      right-to-left-override: true
      left-to-right-isolate: true
      right-to-left-isolate: true
      first-strong-isolate: true
      pop-directional-isolate: true
    custom:
      noemptyinterface:
        type: module
        description: Report empty interface types.
      nohiddentestsignal:
        type: module
        description: Report test skips and sleeps in Go test files.
    cyclop:
      max-complexity: 8
      package-average: 0.0
    errcheck:
      check-type-assertions: false # forcetypeassert owns type assertions
      check-blank: true
      disable-default-exclusions: false
    exhaustive:
      check:
        - switch
        - map
      default-signifies-exhaustive: false
      explicit-exhaustive-switch: false
      explicit-exhaustive-map: false
      package-scope-only: false
    fatcontext:
      check-struct-pointers: true
    forbidigo:
      analyze-types: true
      exclude-godoc-examples: false
      forbid:
        - pattern: '^fmt\.Print.*$'
          msg: Use the injected log/slog logger for application output.
        - pattern: '^print(ln)?$'
          msg: Use the injected log/slog logger for application output.
        - pattern: '^log\.(Print|Printf|Println|Fatal|Fatalf|Fatalln|Panic|Panicf|Panicln|Output)$'
          msg: Use the injected log/slog logger instead of the global log package.
        - pattern: '^slog\.(Debug|Info|Warn|Error|Log|LogAttrs)(Context)?$'
          msg: Use the injected *slog.Logger instead of the global slog functions.
    funlen:
      lines: -1
      statements: 40
      ignore-comments: true
    gochecksumtype:
      default-signifies-exhaustive: false
      include-shared-interfaces: true
    gocognit:
      min-complexity: 9
    gocritic:
      disabled-checks:
        - deprecatedComment
        - hugeParam
        # Owner policy: each parameter declares its own type.
        - paramTypeCombine
        - regexpMust
        - sloppyTypeAssert
        - wrapperFunc
      enabled-tags:
        - diagnostic
        - performance
        - style
      settings:
        rangeExprCopy:
          skipTestFuncs: true
        rangeValCopy:
          sizeThreshold: 256
          skipTestFuncs: true
    gosec:
      severity: low
      confidence: low
      config:
        global:
          # Ignore the suppression effect of "#nosec" comments.
          nosec: true
    govet:
      enable-all: true
      disable:
        - fieldalignment # field order must communicate meaning before padding
        - findcall # a search tool, not a policy analyzer
    interfacebloat:
      max: 5
    iotamixing:
      report-individual: true
    makezero:
      always: false
    mnd:
      checks:
        - argument
        - case
        - condition
        - operation
        - return
        - assign
      ignored-numbers:
        - "0"
        - "1"
        - "2"
    nestif:
      min-complexity: 4
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-no-explanation: []
    perfsprint:
      # staticcheck S1025/S1028 own the sprintf1 and strconcat rewrites.
      err-error: false
      errorf: true
      sprintf1: false
      strconcat: false
    reassign:
      patterns:
        - ".*"
    revive:
      enable-all-rules: false
      rules:
        - name: argument-limit
          arguments: [4]
        # Owner policy: each parameter and result declares its own type.
        - name: enforce-repeated-arg-type-style
          arguments: ["full"]
        # Staged rule: file-length-limit reports three large test files.
        # - name: file-length-limit
        #   arguments:
        #     - max: 450
        #       skip-comments: true
        #       skip-blank-lines: true
        - name: filename-format
          arguments:
            - "^[a-z0-9]+(?:_[a-z0-9]+)*\\.go$"
        - name: max-control-nesting
          arguments: [3]
        - name: modifies-parameter
        - name: var-naming
    # Staged rule settings for the logging policy above.
    # sloglint:
    #   no-global: default
    #   context: scope
    #   static-msg: true
    #   msg-style: lowercased
    #   no-mixed-args: true
    #   attr-only: true
    #   no-raw-keys: true
    #   key-naming-case: snake
    testifylint:
      enable-all: true
      bool-compare:
        ignore-custom-types: false
      formatter:
        check-format-string: true
        require-f-funcs: false
        require-string-msg: true
      go-require:
        # The exemption hid require calls inside httptest.NewServer handlers.
        # Those handlers run on server goroutines, where FailNow is invalid.
        ignore-http-handlers: false
      suite-extra-assert-call:
        mode: remove
    usestdlibvars:
      http-method: true
      http-status-code: true
      time-date-month: true
      time-weekday: true
      time-month: true
      time-layout: true
      crypto-hash: true
      default-rpc-path: true
      sql-isolation-level: true
      tls-signature-scheme: true
      constant-kind: true
    usetesting:
      context-background: false
      context-todo: false
      os-chdir: true
      os-create-temp: true
      os-mkdir-temp: true
      os-setenv: true
      os-temp-dir: true

formatters:
  enable:
    - gofumpt # stricter superset of gofmt; owns all non-import formatting
    - gci # deterministic, opinionated import sorting (regroups from scratch)
  settings:
    gofumpt:
      # Tell gofumpt this module's path so it groups our own packages in a
      # separate import block, matching gci's localmodule section below.
      # Without this, gofumpt and gci disagree on local-import grouping.
      module-path: metadata-scrubber
    gci:
      sections:
        - standard # standard library
        - default # third-party packages
        - localmodule # this module's own packages (auto-detected from go.mod)
