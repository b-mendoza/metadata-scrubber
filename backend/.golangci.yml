version: "2"

linters:
  default: none
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - cyclop
    # Staged rule: depguard needs a recorded package layer graph.
    # - depguard
    - durationcheck
    - errcheck
    - errname
    - errorlint
    - exhaustive
    - fatcontext
    - forbidigo
    - forcetypeassert
    - funlen
    - gocheckcompilerdirectives
    - gochecknoinits
    - gochecksumtype
    - gocognit
    - gocritic
    - godox
    - gosec
    - govet
    - inamedparam
    - ineffassign
    - interfacebloat
    - iotamixing
    - makezero
    - mirror
    - misspell
    - mnd
    - modernize
    - musttag
    - nestif
    - nilerr
    - nilnesserr
    - nilnil
    - nolintlint
    - nosprintfhostport
    - perfsprint
    - predeclared
    - reassign
    - recvcheck
    - revive
    # Staged rule: sloglint reports 38 existing logging-policy findings.
    # - sloglint
    - staticcheck
    - testifylint
    # Staged rule: thelper reports 22 existing helper findings.
    # - thelper
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - usetesting
    - wastedassign
  settings:
    asasalint:
      use-builtin-exclusions: false
    cyclop:
      max-complexity: 8
    errcheck:
      check-type-assertions: false # forcetypeassert owns type assertions
      check-blank: true
    exhaustive:
      check:
        - switch
        - map
    fatcontext:
      check-struct-pointers: true
    forbidigo:
      analyze-types: true
      exclude-godoc-examples: false
      forbid:
        - pattern: '^fmt\.Print.*$'
          msg: Use the injected log/slog logger for application output.
        - pattern: "^print(ln)?$"
          msg: Use the injected log/slog logger for application output.
        - pattern: '^log\.(Print|Printf|Println|Fatal|Fatalf|Fatalln|Panic|Panicf|Panicln|Output)$'
          msg: Use the injected log/slog logger instead of the global log package.
        - pattern: '^slog\.(Debug|Info|Warn|Error|Log|LogAttrs)(Context)?$'
          msg: Use the injected *slog.Logger instead of the global slog functions.
    funlen:
      lines: -1
    gochecksumtype:
      default-signifies-exhaustive: false
      include-shared-interfaces: true
    gocognit:
      min-complexity: 8
    gocritic:
      disabled-checks:
        - deprecatedComment
        - hugeParam
        # Owner policy: each parameter declares its own type.
        - paramTypeCombine
        - regexpMust
        - sloppyTypeAssert
        - wrapperFunc
      enable-all: true
      settings:
        captLocal:
          paramsOnly: false
        elseif:
          skipBalanced: false
        rangeExprCopy:
          sizeThreshold: 0
          skipTestFuncs: false
        rangeValCopy:
          sizeThreshold: 153
          skipTestFuncs: false
        truncateCmp:
          skipArchDependent: false
        underef:
          skipRecvDeref: false
        unnamedResult:
          checkExported: true
    godox:
      keywords:
        - BUG
        - FIXME
        - HACK
        - OPTIMIZE
        - TODO
        - XXX
    gosec:
      config:
        global:
          # Ignore the suppression effect of "#nosec" comments.
          nosec: true
    govet:
      enable-all: true
      disable:
        - fieldalignment # field order must communicate meaning before padding
        - findcall # a search tool, not a policy analyzer
      settings:
        composites:
          whitelist: false
    interfacebloat:
      max: 5
    iotamixing:
      report-individual: true
    misspell:
      locale: US
    mnd:
      ignored-numbers:
        - "2"
    modernize:
      disable:
        # noemptyinterface owns empty-interface policy.
        - any
    nestif:
      min-complexity: 2
    nilnil:
      only-two: false
    nolintlint:
      require-explanation: true
      require-specific: true
    perfsprint:
      # staticcheck S1025/S1028 own the sprintf1 and strconcat rewrites.
      # perfsprint also reports fmt.Sprintf("%s", v), so keep sprintf1 disabled here.
      loop-other-ops: true
      sprintf1: false
      strconcat: false
    predeclared:
      qualified-name: true
    reassign:
      patterns:
        - ".*"
    revive:
      rules:
        - name: argument-limit
          arguments:
            - 4
        - name: bare-return
        - name: blank-imports
        - name: confusing-results
        - name: context-as-argument
        - name: deep-exit
        - name: early-return
        # Owner policy: each parameter and result declares its own type.
        - name: enforce-repeated-arg-type-style
          arguments:
            - full
        - name: error-return
        - name: error-strings
        # Staged rule: file-length-limit reports three large test files.
        # - name: file-length-limit
        #   arguments:
        #     - max: 450
        #       skip-comments: true
        #       skip-blank-lines: true
        - name: filename-format
          arguments:
            - "^[a-z0-9]+(?:_[a-z0-9]+)*\\.go$"
        - name: identical-branches
        - name: if-return
        - name: max-control-nesting
          arguments:
            - 3
        - name: modifies-parameter
        - name: range
        - name: receiver-naming
        - name: string-of-int
        - name: superfluous-else
        - name: time-equal
        - name: time-naming
        - name: unconditional-recursion
        - name: unnecessary-stmt
        - name: use-errors-new
        - name: useless-break
        - name: var-naming
        - name: waitgroup-by-value
    # Staged rule settings for the logging policy above.
    # sloglint:
    #   no-global: all
    #   context: scope
    #   static-msg: true
    #   msg-style: lowercased
    #   no-mixed-args: true
    #   attr-only: true
    #   no-raw-keys: true
    #   key-naming-case: snake
    staticcheck:
      checks:
        - all
      dot-import-whitelist: []
      http-status-code-whitelist: []
    testifylint:
      enable-all: true
      formatter:
        require-string-msg: true
      go-require:
        # The exemption hid require calls inside httptest.NewServer handlers.
        # Those handlers run on server goroutines, where FailNow is invalid.
        ignore-http-handlers: false
    unparam:
      check-exported: true
    unused:
      field-writes-are-uses: false
    usestdlibvars:
      time-date-month: true
      time-weekday: true
      time-month: true
      time-layout: true
      crypto-hash: true
      default-rpc-path: true
      sql-isolation-level: true
      tls-signature-scheme: true
      constant-kind: true
    usetesting:
      os-temp-dir: true

formatters:
  enable:
    - gofumpt # stricter superset of gofmt; owns all non-import formatting
    - gci # deterministic, opinionated import sorting (regroups from scratch)
  settings:
    gofumpt:
      # Tell gofumpt this module's path so it groups our own packages in a
      # separate import block, matching gci's localmodule section below.
      # Without this, gofumpt and gci disagree on local-import grouping.
      module-path: metadata-scrubber
    gci:
      sections:
        - standard # standard library
        - default # third-party packages
        - localmodule # this module's own packages (auto-detected from go.mod)
