# Reviewers must never waive a failing deterministic check.
# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

reviews:
  profile: assertive
  request_changes_workflow: true
  high_level_summary: true
  auto_review:
    auto_incremental_review: false

  path_instructions:
    - path: "**"
      instructions: |
        The code and its configured checks are the source of truth. A document does not override them. If a document and the code disagree, review against the code and report the stale document.
    - path: "backend/**"
      instructions: |
        Review boundary contracts. Require each boundary to declare and validate its input before domain logic runs. Require contract violations and unknown values to return an explicit error. Do not accept silent coercion, default values, or dropped input.
        Require a fix for the cause of a failed check. Accept a narrow exception with a stated reason. Reject broad exceptions. Keep an exception only where an external API forces it.
        Review test call assertions. Require partial assertions for values with fields that the code under test does not control. Do not require an exact full-structure assertion unless the code controls the complete value.
        Review names for clear domain meaning beyond any deterministic denylist. Accept short conventional names that the language community uses.
        Do not review complexity limits, switch statements, lookup-map structure, formatting, or other rules that deterministic checks own.
    - path: "{backend/**,frontend/src/**}"
      instructions: |
        Review only concerns that deterministic checks cannot enforce.
        Review boundary contracts. Require each boundary to declare and validate external input before domain logic runs. Require contract violations and unknown values to fail with a clear error. Do not accept silent coercion, default values, or dropped input.
        Review application code for specific and explicit implementations. Do not accept one general function for many use cases. Require a helper that only avoids repeated code to be deleted and the code written at each call site. Accept duplication in application code.
        Require every generic type parameter to declare an explicit, meaningful constraint.
        Require a fix for the cause of a failed check. Accept a narrow exception with a stated reason. Reject broad exceptions.
        Review test request and response payloads. Require each test to build payloads from the concrete typed contracts at the call site and serialize them there with errors checked. Accept raw wire literals only in dedicated wire-contract tests.
        Review frontend server HTTP boundaries. Require code to build service URLs from request-scoped application bindings. Require server code to return client-safe errors. Reject client-facing messages that include backend response bodies, service URLs, schema issues, or dependency error text.
        Review test call assertions. Require a partial matcher when the code controls only part of a value. Do not require an exact full-structure assertion unless the code controls the complete value.
        Review design intent and simplicity. Prefer construction that removes invalid states. Report unclear or needless abstractions.
        Review names for clear domain meaning beyond any deterministic denylist.
        Do not review complexity limits, switch statements, class syntax, lookup-map structure, formatting, or other rules that deterministic checks own.
    - path: "{backend/lint/**,frontend/oxlint-plugin-metadata-scrubber/**}"
      instructions: |
        Review custom lint rule messages. Require each message to be descriptive, actionable, and educational. Do not accept text that states how to silence or bypass the rule.
    - path: "**/*.md"
      instructions: |
        Review Markdown for ASD-STE100 Simplified Technical English.
        Require short sentences in active voice. Require one idea in each sentence. Prefer the simplest word that keeps the meaning. Require one consistent word for one concept. Keep technical names, identifiers, commands, and code exact.
        Require documents to describe general practices. Accept factual references about architecture and known issues. Reject instructions for specific implementations.
        Review design intent, clarity, and simplicity. Do not report formatting that a deterministic check owns.

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "**/AGENTS.md"
      - "docs/agent/**/*.md"
      - "frontend/docs/agent/**/*.md"
